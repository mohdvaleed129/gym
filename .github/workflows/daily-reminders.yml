
name: BODY FLEX Daily WhatsApp Reminders

on:
  schedule:
    - cron: "30 3 * * *" # 9:00 AM IST
  workflow_dispatch:

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run daily reminders
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          WHATSAPP_PROVIDER: ${{ secrets.WHATSAPP_PROVIDER }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
          WHATSAPP_INTEGRATED_NUMBER: ${{ secrets.WHATSAPP_INTEGRATED_NUMBER }}
          WHATSAPP_TEMPLATE_NAME: ${{ secrets.WHATSAPP_TEMPLATE_NAME }}
          REMINDER_DRY_RUN: "false"
        run: node src/jobs/reminderScheduler.js --run-once
